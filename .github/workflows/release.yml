# SPEC 13: on every v* tag, build the images and publish them to GHCR with the tag; the VPS pulls them
# (deploy/scripts/desplegar.sh). Nothing is built on the VPS, and CI has no SSH to it.
#
#   ghcr.io/<owner>/halsa-backend:<tag>       the API, the Worker and the Migrador (Halsa:Rol decides)
#   ghcr.io/<owner>/halsa-bff-paciente:<tag>  the BFF of the patient portal
#   ghcr.io/<owner>/halsa-postgres:17         PostgreSQL 17 + pgBackRest + pgaudit (deploy/postgres), also as 17-<tag>
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  imagenes:
    name: Imagen ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - nombre: halsa-backend
            contexto: .
            dockerfile: src/Halsa.Backend.Api/Dockerfile
            tags: "{0}"
          - nombre: halsa-bff-paciente
            contexto: .
            dockerfile: src/Halsa.Bff.Paciente/Dockerfile
            tags: "{0}"
          - nombre: halsa-postgres
            contexto: deploy/postgres
            dockerfile: deploy/postgres/Dockerfile
            tags: "17,17-{0}"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          lista=""
          IFS=',' read -ra plantillas <<< "${{ format(matrix.tags, github.ref_name) }}"
          for t in "${plantillas[@]}"; do
            lista+="ghcr.io/${owner}/${{ matrix.nombre }}:${t},"
          done
          echo "lista=${lista%,}" >> "$GITHUB_OUTPUT"

      - name: Build y push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.lista }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

      - name: Digest
        run: |
          echo "### ${{ matrix.nombre }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tags: \`${{ steps.tags.outputs.lista }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
