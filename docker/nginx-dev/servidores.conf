# The three proxy hosts as NPM generates them, reduced to what matters (SPEC 13): listen,
# server_name and the certificate (NPM's part), and the include of Halsa's file (the "Advanced"
# field). Rendered by deploy/npm/renderizar.sh with the HALSA_HOST_* of docker-compose.yml or CI.

server {
    listen 443 ssl;
    http2 on;
    server_name ${HALSA_HOST_API};
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/servidor.key;

    include /data/nginx/custom/halsa/sitios/api.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${HALSA_HOST_INTEGRACIONES};
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/servidor.key;

    include /data/nginx/custom/halsa/sitios/integraciones.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${HALSA_HOST_PACIENTES};
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/servidor.key;

    include /data/nginx/custom/halsa/sitios/pacientes.conf;
}
