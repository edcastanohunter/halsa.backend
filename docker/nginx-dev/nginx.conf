# ─────────────────────────────────────────────────────────────────────────────
# Nginx de DESARROLLO y del CI que imita a Nginx Proxy Manager (SPEC 13).
#
# NPM pone el nivel http, los server con listen/server_name/certificado y la política TLS;
# Halsa pone lo suyo en /data/nginx/custom/halsa (deploy/npm, renderizado por
# deploy/npm/renderizar.sh). Aquí, lo de NPM es esta configuración mínima y servidores.conf;
# lo de Halsa es exactamente lo mismo que se copia a NPM en producción, en las mismas rutas.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    access_log /dev/stdout;

    # NPM's TLS policy (TLS 1.2 + 1.3, ECDHE-AESGCM for 1.2).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;

    # NPM's resolver (generated from /etc/resolv.conf by arrancar.sh): Halsa's upstreams are variables.
    include /etc/nginx/simulado/resolver.conf;

    # What http_top.conf includes in NPM.
    include /data/nginx/custom/halsa/http.conf;

    # 443 without a known name: no answer.
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    include /etc/nginx/simulado/servidores.conf;
}
