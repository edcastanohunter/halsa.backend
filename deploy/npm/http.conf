# ─────────────────────────────────────────────────────────────────────────────
# Nivel http de Halsa en Nginx Proxy Manager (SPEC 13).
#
# NPM lo incluye desde /data/nginx/custom/http_top.conf (una línea que agrega
# sincronizar-npm.sh). Todo lleva el prefijo halsa_: NPM sirve otros sitios y estas
# zonas no deben chocar con las suyas. Nada aquí cambia el comportamiento de los otros
# sitios: solo se declaran zonas y un map que usan los proxy hosts de Halsa.
# ─────────────────────────────────────────────────────────────────────────────

# halsa-api: 20 r/s per IP, burst 40.
limit_req_zone $binary_remote_addr zone=halsa_api_ip:10m rate=20r/s;

# halsa-integraciones: 10 r/s per client certificate, burst 50. Without a certificate there is no request to limit.
limit_req_zone $ssl_client_fingerprint zone=halsa_integraciones_cert:10m rate=10r/s;

# halsa-pacientes: 10 r/s per IP, and POST /paciente/api/vinculos 5 r/min per IP (the activation codes).
limit_req_zone $binary_remote_addr zone=halsa_pacientes_ip:10m rate=10r/s;
map $request_method $halsa_vinculo_por_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $halsa_vinculo_por_ip zone=halsa_pacientes_vinculos:10m rate=5r/m;
