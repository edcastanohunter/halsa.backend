# halsa-integraciones — los cores de las ARL y los sistemas de las IPS (SPEC 13). El "Advanced" del
# proxy host en NPM:
#   include /data/nginx/custom/halsa/sitios/integraciones.conf;
#   #; location / { ... } lo define el include de Halsa: esta linea evita el location / de NPM
#
# mTLS obligatorio con la CA privada de Halsa (intermedia + raíz, CRL de las dos), copiada por
# sincronizar-npm.sh a /data/halsa-pki. Sin un certificado válido y vigente, Nginx responde 400 y
# nada llega a la API ni a Keycloak. El certificado verificado viaja como PEM url-encoded:
#   X-Client-Cert      → IntegrationCertificateBindingMiddleware (cnf.x5t#S256)
#   ssl-client-cert    → el lookup x509 "nginx" de Keycloak (token ligado al certificado),
#   ssl-client-verify    que solo lo acepta con SUCCESS
# TLS 1.2 y 1.3: la política de NPM.

ssl_verify_client on;
ssl_client_certificate /data/halsa-pki/halsa-integraciones-ca.pem;
ssl_crl /data/halsa-pki/halsa-integraciones.crl;
ssl_verify_depth 2;

# Upstreams through variables: resolved per request (NPM's resolver), not when Nginx loads. If a Halsa
# container is down, only its routes answer 502; NPM and its other sites still start and reload.
set $halsa_api ${HALSA_UPSTREAM_API};
set $halsa_keycloak ${HALSA_UPSTREAM_KEYCLOAK};

include /data/nginx/custom/halsa/snippets/cabeceras.conf;
include /data/nginx/custom/halsa/snippets/proxy.conf;

proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
proxy_set_header ssl-client-verify $ssl_client_verify;

client_max_body_size 2m;
limit_req zone=halsa_integraciones_cert burst=50 nodelay;

location ^~ /v1/integraciones/ {
    proxy_pass $halsa_api;
}

# The IPS upload their incapacidades (SPEC 07): POST only, with room for the PDF supports.
location ~ "^/v1/casos/[0-9a-fA-F-]{36}/incapacidades$" {
    limit_except POST {
        deny all;
    }
    client_max_body_size 15m;
    proxy_pass $halsa_api;
}

# The token is requested here, with the certificate, so the shared Keycloak binds it (cnf.x5t#S256).
# The issuer is still the shared Keycloak's public URL (auth.edcastdev.com): its hostname is fixed.
location = /auth/realms/halsa/protocol/openid-connect/token {
    limit_except POST {
        deny all;
    }
    proxy_pass $halsa_keycloak/realms/halsa/protocol/openid-connect/token;
}

location / {
    return 404;
}
