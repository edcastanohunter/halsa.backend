# halsa-pacientes — el portal del paciente, solo a través de su BFF (SPEC 12 y 13). El "Advanced"
# del proxy host en NPM:
#   include /data/nginx/custom/halsa/sitios/pacientes.conf;
#   #; location / { ... } lo define el include de Halsa: esta linea evita el location / de NPM
#
# Rutas: /paciente/* y /health/vivo. El navegador nunca ve la API ni un token.

# Upstreams through variables: resolved per request (NPM's resolver), not when Nginx loads. If a Halsa
# container is down, only its routes answer 502; NPM and its other sites still start and reload.
set $halsa_bff ${HALSA_UPSTREAM_BFF};

include /data/nginx/custom/halsa/snippets/cabeceras.conf;
include /data/nginx/custom/halsa/snippets/proxy.conf;

proxy_set_header X-Client-Cert "";
proxy_set_header ssl-client-cert "";
proxy_set_header ssl-client-verify "";

client_max_body_size 1m;
limit_req zone=halsa_pacientes_ip burst=20 nodelay;

# The external uptime monitor.
location = /health/vivo {
    proxy_pass $halsa_bff;
}

# The activation code is guessable by brute force only if nobody counts: 5 POST/min per IP.
location = /paciente/api/vinculos {
    limit_req zone=halsa_pacientes_ip burst=20 nodelay;
    limit_req zone=halsa_pacientes_vinculos burst=2 nodelay;
    proxy_pass $halsa_bff;
}

location ^~ /paciente/ {
    proxy_pass $halsa_bff;
}

location / {
    return 404;
}
