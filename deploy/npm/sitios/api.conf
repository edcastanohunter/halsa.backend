# halsa-api — el backoffice y sus usuarios (SPEC 13). El "Advanced" del proxy host en NPM:
#   include /data/nginx/custom/halsa/sitios/api.conf;
#   #; location / { ... } lo define el include de Halsa: esta linea evita el location / de NPM
#
# NPM pone listen, server_name, el certificado y la política TLS. Aquí: cabeceras, límites y
# TODAS las location. Rutas: /v1/* excepto /v1/integraciones/* (solo por halsa-integraciones, con
# mTLS) y /v1/paciente/* (solo por el BFF), y /health/vivo. Lo demás, incluido /health, es 404.

# Upstreams through variables: resolved per request (NPM's resolver), not when Nginx loads. If a Halsa
# container is down, only its routes answer 502; NPM and its other sites still start and reload.
set $halsa_api ${HALSA_UPSTREAM_API};

include /data/nginx/custom/halsa/snippets/cabeceras.conf;
include /data/nginx/custom/halsa/snippets/proxy.conf;

# No mTLS here: a forged certificate header never reaches the API.
proxy_set_header X-Client-Cert "";
proxy_set_header ssl-client-cert "";
proxy_set_header ssl-client-verify "";

client_max_body_size 15m;
limit_req zone=halsa_api_ip burst=40 nodelay;

location = /health/vivo {
    proxy_pass $halsa_api;
}

location ^~ /v1/integraciones {
    return 404;
}

location ^~ /v1/paciente {
    return 404;
}

location ^~ /v1/ {
    proxy_pass $halsa_api;
}

location / {
    return 404;
}
