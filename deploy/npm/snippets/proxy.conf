# Proxy to Halsa's backends (SPEC 13). Included at server level by each sitios/*.conf; a location
# must never use proxy_set_header, or it drops all of these.
#
# The trust headers are REWRITTEN, never appended. NPM's default ($proxy_add_x_forwarded_for)
# would keep whatever the client sent; here the API (ForwardedHeaders, ForwardLimit=1) sees exactly
# one hop, NPM's. X-Client-Cert, ssl-client-cert and ssl-client-verify are set by each site: empty
# (= not sent) everywhere but halsa-integraciones, where they carry the certificate NPM verified.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Scheme "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Original-For "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_buffering on;

# The backends' own error pages pass through; Halsa only writes its own for the rate limit.
limit_req_status 429;
limit_req_log_level warn;
error_page 429 @halsa_limitado;
location @halsa_limitado {
    include /data/nginx/custom/halsa/snippets/cabeceras.conf;
    add_header Retry-After 1 always;
    default_type application/problem+json;
    return 429 '{"type":"https://www.rfc-editor.org/rfc/rfc6585#section-4","title":"Too many requests","status":429,"errorCode":"General.DemasiadasSolicitudes"}';
}
