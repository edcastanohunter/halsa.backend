# Security headers of every Halsa host (SPEC 13). "always": also on 4xx/5xx.
# Included at server level by each sitios/*.conf; a location must never use add_header, or it
# drops these. NPM's own HSTS toggle stays OFF on Halsa's proxy hosts: it would duplicate the header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
