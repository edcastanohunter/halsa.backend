# pgBackRest de producción (SPEC 13).
#
# Repositorio en un bucket S3 externo, DISTINTO del bucket WORM de los sellos, cifrado
# con AES-256-CBC. Las credenciales y la passphrase no están aquí: arrancar.sh las
# escribe en conf.d/secretos.conf desde los secretos de Docker; el bucket, en conf.d/bucket.conf.
#
# Programación (cron del VPS, runbook 04):
#   completo    domingo 01:00
#   diferencial lunes a sábado 01:00
#   WAL         continuo (archive_command): PITR a cualquier instante retenido
# Retención: 4 completos (y sus diferenciales y WAL).

[global]
repo1-type=s3
repo1-path=/halsa
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-full-type=count

process-max=2
compress-type=zst
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[global:archive-push]
process-max=2

[halsa]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
