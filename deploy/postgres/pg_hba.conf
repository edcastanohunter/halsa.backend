# pg_hba.conf de producción (SPEC 13): por red solo hostssl con scram-sha-256.
# TYPE    DATABASE        USER            ADDRESS         METHOD

# Inside the container: the entrypoint's initdb scripts, pgbackrest and the healthcheck.
local     all             postgres                        peer
local     all             all                             scram-sha-256

# The application, only from the "datos" network (172.30.2.0/24, deploy-quadlets/halsa-datos.network), always over TLS.
hostssl   halsa           halsa_owner,halsa_app,halsa_clinico,halsa_ingesta,halsa_worker   172.30.2.0/24   scram-sha-256

# Anything else, including plain-text connections, is rejected.
host      all             all             all             reject
