# PostgreSQL de producción (SPEC 13). Se pasa con -c config_file=; los valores que no
# están aquí son los de fábrica.

listen_addresses = '*'          # only the "datos" network reaches it: no port is published
port = 5432
max_connections = 200
hba_file = '/etc/postgresql/pg_hba.conf'

# ── TLS: pg_hba.conf only admits hostssl ──────────────────────────────────────
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/servidor.crt'
ssl_key_file = '/var/lib/postgresql/tls/servidor.key'
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = scram-sha-256

# ── Memory (a VPS of 8 GB; adjust in runbook 01) ──────────────────────────────
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB

# ── WAL and continuous archiving to pgBackRest (PITR) ─────────────────────────
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=halsa archive-push %p'
archive_timeout = 300           # at most 5 minutes of WAL lost if the VPS dies
max_wal_senders = 3
max_wal_size = 2GB

# ── pgaudit: who changed the schema or the roles ──────────────────────────────
# Data access is audited by the application (auditoria.accesos, SPEC 04); here, the DDL and the roles.
shared_preload_libraries = 'pgaudit'
pgaudit.log = 'ddl, role'
pgaudit.log_catalog = off
pgaudit.log_relation = on

# ── Logging (to stderr: docker logs) ──────────────────────────────────────────
log_destination = 'stderr'
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
