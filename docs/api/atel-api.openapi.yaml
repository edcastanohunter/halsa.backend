openapi: 3.1.0
info:
  title: Halsa ATEL API
  version: 1.0.0-draft
  summary: Contrato de integración ARL/IPS y del frontend para la gestión de siniestros ATEL.
  description: |
    Contrato conceptual. La fuente de verdad al implementar es el OpenAPI que genera
    `Microsoft.AspNetCore.OpenApi` en `/openapi/v1.json`. Ambos deben coincidir y los cambios se
    revisan aquí primero.

    Convenciones:
    - JSON en camelCase. Fechas en ISO 8601: `date` para días y `date-time` con zona horaria para instantes.
    - Los errores siguen RFC 9457 (`application/problem+json`). El campo `code` es estable y apto para i18n en el frontend.
    - Los códigos externos se envían como `{ sistema, codigo }` para mapearlos a FHIR `Coding` sin pérdida.
    - Todas las escrituras de integración exigen `Idempotency-Key`.
    - El tenant (ARL) NUNCA viaja en el cuerpo ni en la URL. Se toma del token.
servers:
  - url: https://api.halsa.co/v1
    description: Producción
  - url: http://localhost:5600/v1
    description: Desarrollo local

tags:
  - name: Integraciones
    description: Entrada desde los cores de las ARL y las IPS (máquina a máquina).
  - name: Incapacidades
    description: Carga de certificados de incapacidad por IPS o personal médico.
  - name: Clinico
    description: |
      Historia clínica. La carga de conceptos (SPEC 06) y, con la SPEC 08, su lectura, el soporte de las incapacidades
      y el dictamen PCL. Toda lectura exige el permiso, `acr >= 2` y estar asignado al caso (ABAC), salvo el acceso de
      emergencia; un caso no visible responde `404` y uno visible sin asignación `403` (`Clinico.NoAsignado`).
  - name: Auditoria
    description: Revisión de los accesos de emergencia por el oficial de privacidad (SPEC 08).
  - name: Plazos
    description: |
      Plazos legales de cada caso (SPEC 09), calculados sobre el calendario laboral colombiano. Los abre un evento, los
      alerta y los vence el Worker, y los cumple otro evento o una persona de la ARL. Las reglas son las de
      `sst.reglas_termino`, pendientes de validación jurídica.
  - name: Paciente
    description: |
      El portal del paciente (SPEC 12), siempre detrás del BFF `halsa-bff-paciente`: el navegador nunca tiene un token.
      Ninguna ruta recibe ids de trabajador; todo se resuelve desde el `sub` del token y los vínculos de la cuenta, que se
      crean canjeando un código de activación de la ARL. Solo hitos administrativos: ni diagnósticos, ni porcentajes,
      ni fundamentos. Un token del personal responde `403`.
  - name: SolicitudesCopiaHc
    description: |
      La bandeja de solicitudes de copia de la historia clínica del tenant (SPEC 12; Res. 1995/1999, art. 14). La copia
      se entrega por el canal formal; cada solicitud corre el plazo `SOLICITUD_COPIA_HC` hasta que se cierra.

security:
  - personal: []

paths:
  /integraciones/furat:
    post:
      tags: [Integraciones]
      operationId: recibirFurat
      summary: Recibe un FURAT (Res. 156/2005) desde el core de una ARL.
      description: |
        Webhook entrante. Responde `202` en cuanto el reporte queda persistido y radicado.
        El cruce con la afiliación y la deduplicación son asíncronos. Su resultado se notifica
        con los webhooks salientes `caso.validado` y `caso.rechazado`.

        Requiere:
        - mTLS en Nginx, con un token ligado al certificado (`cnf.x5t#S256`).
        - Un token de client credentials del client `int-arl-{codigo}` con el rol `integracion:furat:write`.
      security:
        - integracion: [integracion:furat:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuratRequest' }
            examples:
              caidaAltura: { $ref: '#/components/examples/FuratCaidaAltura' }
      responses:
        '202':
          description: Reporte aceptado y radicado.
          headers:
            Location:
              description: URL para consultar el estado del procesamiento.
              schema: { type: string, example: /v1/integraciones/furat/0192f1e4-7c1a-7b2e-9f00-3c1d2e4f5a6b }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RadicacionResponse' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }
        '413': { $ref: '#/components/responses/DemasiadoGrande' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /integraciones/furat/{solicitudId}:
    get:
      tags: [Integraciones]
      operationId: consultarEstadoFurat
      summary: Estado del procesamiento asíncrono de un FURAT.
      description: |
        `plazos` son los plazos `ABIERTO` del caso (SPEC 09). Se abren de forma asíncrona, así que la respuesta `202`
        de la radicación los trae vacíos y esta consulta los muestra cuando el Worker procesó el evento.
      security:
        - integracion: [integracion:furat:write]
      parameters:
        - name: solicitudId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado actual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RadicacionResponse' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /integraciones/furep:
    post:
      tags: [Integraciones]
      operationId: recibirFurep
      summary: Recibe un FUREP (Res. 156/2005) desde el core de una ARL.
      description: Mismo comportamiento, seguridad e idempotencia que `/integraciones/furat`.
      security:
        - integracion: [integracion:furep:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FurepRequest' }
      responses:
        '202':
          description: Reporte aceptado y radicado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RadicacionResponse' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/ConflictoIdempotencia' }

  /integraciones/conceptos-medicos:
    post:
      tags: [Integraciones]
      operationId: recibirConceptoMedico
      summary: Recibe un concepto médico, una evolución o un concepto de rehabilitación desde el sistema de una IPS.
      description: |
        Responde `201` en cuanto el registro queda cifrado y guardado en la historia clínica del caso. No hay
        procesamiento posterior. Es idempotente por `(IPS, Idempotency-Key)`: el mismo cuerpo devuelve la misma
        respuesta, y otro cuerpo con la misma llave devuelve `409`. Las llaves de cada emisor son independientes.

        El caso tiene que estar remitido a la IPS del token, con la remisión vigente. Si no, la respuesta es `404`,
        igual que si el caso no existiera. El registro queda en el tenant del caso y se cifra con su DEK.

        El profesional que firma viaja en el cuerpo: la IPS responde por su personal. La service account queda
        como `profesional_sub` y en la auditoría.

        Requiere:
        - mTLS en Nginx, con un token ligado al certificado (`cnf.x5t#S256`).
        - Un token de client credentials del client `int-ips-{REPS}` con el rol `integracion:clinico:write`.
      security:
        - integracion: [integracion:clinico:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConceptoMedicoRequest' }
            examples:
              controlPostquirurgico: { $ref: '#/components/examples/ConceptoMedicoControl' }
      responses:
        '201':
          description: Concepto registrado. Repetir la llave con el mismo cuerpo devuelve la misma respuesta.
          headers:
            Location:
              description: El registro en la historia clínica del caso (`GET`, SPEC 08).
              schema: { type: string, example: /v1/casos/0192f1e4-7c1a-7b2e-9f00-3c1d2e4f5a6b/registros-clinicos/0192f1e5-0000-7000-8000-000000000001 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroClinicoCreadoResponse' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoRegistroClinico' }

  /casos/{casoId}/registros-clinicos:
    post:
      tags: [Clinico]
      operationId: registrarRegistroClinico
      summary: Registra un concepto médico, una evolución o un concepto de rehabilitación en el caso.
      description: |
        Lo usa el backoffice. Un médico de la ARL del caso, o de una IPS con remisión vigente, añade un registro a
        la historia clínica. Con `corrigeA` corrige un registro anterior del mismo caso: el original no cambia y el
        nuevo apunta a él.

        El profesional que firma sale del token (claims `rethus`, `tipo_documento` y `numero_documento`), nunca del
        cuerpo. Si falta alguno, la respuesta es `403` con `Clinico.ProfesionalSinRegistro`.

        Para escribir basta con ver el caso. La asignación al caso solo se exige para leer la historia clínica (SPEC 08).
      security:
        - personal: [clinico:write]
      parameters:
        - name: casoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroClinicoRequest' }
      responses:
        '201':
          description: Registro creado.
          headers:
            Location:
              description: El registro en la historia clínica del caso (`GET`, SPEC 08).
              schema: { type: string, example: /v1/casos/0192f1e4-7c1a-7b2e-9f00-3c1d2e4f5a6b/registros-clinicos/0192f1e5-0000-7000-8000-000000000001 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroClinicoCreadoResponse' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoRegistroClinico' }

    get:
      tags: [Clinico]
      operationId: listarRegistrosClinicos
      summary: Historia clínica del caso, descifrada y en orden cronológico (acceso auditado).
      description: |
        Requiere `clinico:read`, `acr >= 2` y la asignación al caso (o el acceso de emergencia). **Excluye** los
        registros `DICTAMEN_PCL`: su motivación solo sale por `GET /casos/{casoId}/dictamen-pcl`. Un registro corregido
        se sigue devolviendo, con `corregidoPor`. Cada lectura queda en `auditoria.accesos` (`LEER / REGISTRO_CLINICO`).
      security:
        - personal: [clinico:read]
      parameters:
        - $ref: '#/components/parameters/CasoId'
        - $ref: '#/components/parameters/MotivoAcceso'
      responses:
        '200':
          description: Los registros del caso.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RegistroClinicoResponse' }
        '401': { $ref: '#/components/responses/StepUpRequerido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /casos/{casoId}/registros-clinicos/{registroId}:
    get:
      tags: [Clinico]
      operationId: obtenerRegistroClinico
      summary: Un registro de la historia clínica del caso (acceso auditado).
      description: |
        La misma política que la lista. Un registro `DICTAMEN_PCL`, o de otro caso, responde `404`
        (`Clinico.RegistroNoEncontrado`).
      security:
        - personal: [clinico:read]
      parameters:
        - $ref: '#/components/parameters/CasoId'
        - name: registroId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/MotivoAcceso'
      responses:
        '200':
          description: El registro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroClinicoResponse' }
        '401': { $ref: '#/components/responses/StepUpRequerido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /casos/{casoId}/incapacidades:
    get:
      tags: [Incapacidades]
      operationId: listarIncapacidades
      summary: Lista las incapacidades de un caso con sus alertas.
      description: |
        Lo consume el backoffice. Devuelve las incapacidades del caso ordenadas por `fechaInicio`, con las alertas de
        días acumulados calculadas en el momento (no se guardan).

        Solo datos administrativos: ni diagnósticos, ni observaciones, ni el profesional que firmó.

        Autorización:
        - Permiso `incapacidades:read`.
        - Actor ARL: el caso pertenece a su tenant.
        - Actor IPS: existe una remisión vigente del caso hacia su IPS.
        - Las integraciones no consultan por aquí (`403` con `Incapacidades.ActorNoAutorizado`).

        La lectura queda auditada como `LEER / INCAPACIDAD`.
      security:
        - personal: [incapacidades:read]
      parameters:
        - name: casoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Las incapacidades del caso. Una lista vacía si no tiene.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncapacidadResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

    post:
      tags: [Incapacidades]
      operationId: cargarIncapacidad
      summary: Carga un certificado de incapacidad temporal con su soporte PDF.
      description: |
        Lo consumen el backoffice (médico laboral o de IPS) y las integraciones de IPS.

        Autorización:
        - Permiso `incapacidades:write`.
        - Actor ARL: el caso pertenece a su tenant.
        - Actor IPS: existe una remisión vigente del caso hacia su IPS.
        - Integración: solo la de una IPS (`int-ips-*`). Está exenta del step-up.
        - Usuarios humanos: `acr >= 2` (MFA). Si no se cumple, la respuesta es `401` con step-up.

        El diagnóstico y las observaciones se guardan cifrados en la historia clínica, como un registro de tipo
        `CERTIFICADO_INCAPACIDAD`. Ese tipo solo nace por este endpoint. La respuesta solo devuelve datos
        administrativos y alertas.

        El profesional que firma sale del token en el backoffice (claims `rethus`, `tipo_documento` y
        `numero_documento`; si falta alguno, `403` con `Clinico.ProfesionalSinRegistro`) y del campo `profesional` en
        la integración, donde es obligatorio.

        El cuerpo es `multipart/form-data` con exactamente dos partes (el request completo admite 12 MB):
        - `datos` (`application/json`): metadatos del certificado.
        - `soporte` (`application/pdf`): documento firmado, máximo 10 MB.

        El soporte se analiza con antivirus antes de guardarse, y se guarda cifrado. Si el antivirus no responde,
        la carga falla cerrada con `503`.

        El emisor de la `Idempotency-Key` es la IPS en la integración (`ips:{REPS}`) y la persona en el backoffice
        (`sub:{sub}`).
      security:
        - personal: [incapacidades:write]
        - integracion: [incapacidades:write]
      parameters:
        - name: casoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datos, soporte]
              properties:
                datos: { $ref: '#/components/schemas/IncapacidadRequest' }
                soporte:
                  type: string
                  contentMediaType: application/pdf
                  description: PDF del certificado. Máximo 10 MB. Se valida la firma mágica `%PDF-` y se analiza con antivirus.
            encoding:
              datos: { contentType: application/json }
              soporte: { contentType: application/pdf }
      responses:
        '201':
          description: Incapacidad registrada. Repetir la misma llave con el mismo cuerpo devuelve la misma respuesta.
          headers:
            Location:
              schema: { type: string, example: /v1/casos/0192f1e4-7c1a-7b2e-9f00-3c1d2e4f5a6b/incapacidades/0192f1e5-0000-7000-8000-000000000001 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncapacidadResponse' }
        '400':
          description: |
            La `Idempotency-Key` falta o no es un UUID, las partes no son exactamente `datos` y `soporte`
            (`Incapacidades.PartesInvalidas`), o `datos` no pasa la validación (las rutas de `errors` empiezan por
            `datos.`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { $ref: '#/components/responses/StepUpRequerido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            La `Idempotency-Key` ya se usó con un cuerpo distinto, o la IPS emisora ya cargó ese
            `numeroCertificado` para la ARL del caso (`Incapacidades.CertificadoDuplicado`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '413':
          description: El soporte supera 10 MB o el request 12 MB (`Archivos.SoporteDemasiadoGrande`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '415':
          description: El soporte no empieza por `%PDF-` (`Archivos.NoEsPdf`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: |
            El antivirus encontró una amenaza en el soporte (`Archivos.SoporteInfectado`; no se guarda nada), o se
            incumple una regla. Las reglas están pendientes de validación jurídica:
            - `CASO_CERRADO`: el caso está cerrado o rechazado.
            - `INCAPACIDAD_SOLAPADA`: el periodo se cruza con otra incapacidad del caso.
            - `PRORROGA_SIN_INICIAL`: `tipo=PRORROGA` sin `prorrogaDe`, o `prorrogaDe` no existe en el caso.
            - `PRORROGA_NO_ES_ULTIMA`: `prorrogaDe` no es la última incapacidad de su cadena.
            - `PRORROGA_DISCONTINUA`: hay más de 30 días entre el fin de `prorrogaDe` y el inicio (D. 1427/2022).
            - `PRORROGA_DIAGNOSTICO_NO_RELACIONADO`: la categoría CIE-10 (tres primeros caracteres) del diagnóstico
              principal no es la de la incapacidad inicial de la cadena.
            - `FECHA_ANTERIOR_AL_EVENTO`: `fechaInicio` es anterior a la fecha del evento del caso.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503':
          description: El antivirus no está disponible (`Archivos.AntivirusNoDisponible`). Reintente más tarde.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /casos/{casoId}/incapacidades/{incapacidadId}/soporte:
    get:
      tags: [Clinico]
      operationId: descargarSoporteIncapacidad
      summary: Descarga el PDF soporte de la incapacidad, descifrado (acceso clínico auditado).
      description: |
        El PDF contiene el diagnóstico: la misma política que la historia clínica (`clinico:read`, `acr >= 2` y la
        asignación, o el acceso de emergencia). La lectura queda en `auditoria.accesos` (`LEER / SOPORTE`) antes de abrir
        el archivo. Si el archivo no descifra o su SHA-256 no es el del original, responde `500` con
        `Archivos.Corrupto` y no entrega ningún byte.
      security:
        - personal: [clinico:read]
      parameters:
        - $ref: '#/components/parameters/CasoId'
        - name: incapacidadId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/MotivoAcceso'
      responses:
        '200':
          description: El PDF original, byte a byte.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="incapacidad-INC-2026-000123.pdf"' }
            Cache-Control:
              schema: { type: string, const: 'no-store' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/StepUpRequerido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: El caso, la incapacidad o su soporte no existen o no son visibles (`Clinico.SoporteNoEncontrado`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '500':
          description: El archivo no pasó la verificación de integridad (`Archivos.Corrupto`). No se entrega.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /casos/{casoId}/dictamen-pcl:
    get:
      tags: [Clinico]
      operationId: obtenerDictamenPcl
      summary: Dictamen de pérdida de capacidad laboral vigente (acceso sensible y auditado).
      description: |
        Requiere `pcl:dictamen:read`, la asignación al caso (o el acceso de emergencia), `acr >= 2` y `auth_time` de 15
        minutos o menos. Es la única salida de la motivación (el registro `DICTAMEN_PCL` de la historia clínica). Cada
        lectura, permitida o denegada, queda en `auditoria.accesos`. Sin dictamen, `404` con `Dictamen.NoEncontrado`.
      security:
        - personal: [pcl:dictamen:read]
      parameters:
        - $ref: '#/components/parameters/CasoId'
        - $ref: '#/components/parameters/MotivoAcceso'
      responses:
        '200':
          description: Dictamen.
          headers:
            Cache-Control:
              schema: { type: string, const: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictamenPclResponse' }
        '401': { $ref: '#/components/responses/StepUpRequerido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Clinico]
      operationId: registrarDictamenPcl
      summary: Registra el dictamen PCL del caso, o corrige el vigente.
      description: |
        Requiere `pcl:dictamen:write`, la asignación al caso (el acceso de emergencia no abre escrituras), `acr >= 2` y
        `auth_time` de 15 minutos o menos. Solo el personal de la ARL del caso (`Dictamen.ActorNoAutorizado`).
        El calificador sale del token.

        En una sola transacción: el registro `DICTAMEN_PCL` de la historia clínica (cifrado; `fundamentos` va en
        `analisis` y los `componentes` en `observaciones`), la parte administrativa, la calificación del caso
        (porcentaje, fecha de estructuración y origen) y su paso a `EnCalificacionPcl`, y la auditoría (`CREAR` o
        `CORREGIR` sobre `REGISTRO_CLINICO`).

        Un solo dictamen vigente por caso: sin `corrigeA`, un segundo `POST` responde `409` con `Dictamen.YaExiste`.
        Con `corrigeA` (el `id` del vigente) lo reemplaza, solo mientras esté `PENDIENTE` (si no, `409` con
        `Dictamen.YaNotificado`).
      security:
        - personal: [pcl:dictamen:write]
      parameters:
        - $ref: '#/components/parameters/CasoId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarDictamenPclRequest' }
      responses:
        '201':
          description: Dictamen registrado.
          headers:
            Location:
              schema: { type: string, example: /v1/casos/0192f1e4-7c1a-7b2e-9f00-3c1d2e4f5a6b/dictamen-pcl }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictamenPclResponse' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/StepUpRequerido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: |
            El caso no existe o no es visible (`Clinico.CasoNoEncontrado`), o `corrigeA` sin dictamen vigente
            (`Dictamen.NoEncontrado`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409': { $ref: '#/components/responses/ConflictoDictamen' }

  /casos/{casoId}/dictamen-pcl/notificar:
    post:
      tags: [Clinico]
      operationId: notificarDictamenPcl
      summary: Registra la notificación del dictamen PCL vigente.
      description: |
        La misma política que el registro del dictamen. Es un dato administrativo: solo desde `PENDIENTE`, y
        `notificadoEn` no puede ser futuro ni anterior a `fechaDictamen` (en hora de Colombia;
        `Dictamen.NotificacionFueraDeRango`). Emite `DictamenPclNotificadoIntegrationEvent`, del que cuelga el plazo de
        controversia (SPEC 09). Se audita como `ACTUALIZAR / CASO`.
      security:
        - personal: [pcl:dictamen:write]
      parameters:
        - $ref: '#/components/parameters/CasoId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificarDictamenPclRequest' }
      responses:
        '204': { description: Notificación registrada. }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/StepUpRequerido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El dictamen ya no está `PENDIENTE` (`Dictamen.YaNotificado`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /auditoria/revisiones-emergencia:
    get:
      tags: [Auditoria]
      operationId: listarRevisionesEmergencia
      summary: Revisiones de los accesos de emergencia a los casos del tenant.
      description: |
        Para el oficial de privacidad de una ARL (`auditoria:revisar`), de la más reciente a la más antigua. Solo las
        del tenant del token. La consulta queda auditada (`LEER / AUDITORIA`).
      security:
        - personal: [auditoria:revisar]
      parameters:
        - name: estado
          in: query
          required: false
          description: Sin `estado`, todas.
          schema: { type: string, enum: [PENDIENTE, CERRADA] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Una página de revisiones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaRevisionesEmergencia' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /auditoria/revisiones-emergencia/{id}/cerrar:
    post:
      tags: [Auditoria]
      operationId: cerrarRevisionEmergencia
      summary: Cierra la revisión de un acceso de emergencia con su conclusión.
      description: |
        Una revisión cerrada no cambia: un segundo cierre responde `409` (`Auditoria.RevisionYaCerrada`). El cierre queda
        auditado (`ACTUALIZAR / AUDITORIA`).
      security:
        - personal: [auditoria:revisar]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CerrarRevisionEmergenciaRequest' }
      responses:
        '204': { description: Revisión cerrada. }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: La revisión no existe o no es del tenant (`Auditoria.RevisionNoEncontrada`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: La revisión ya está cerrada (`Auditoria.RevisionYaCerrada`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /casos/{casoId}/plazos:
    get:
      tags: [Plazos]
      operationId: listarPlazosCaso
      summary: Plazos legales de un caso.
      description: |
        Todos los plazos del caso, de cualquier estado, ordenados por vencimiento. Solo el personal de la ARL del caso
        (una IPS no ve plazos). La consulta queda auditada (`LEER / PLAZO`).
      security:
        - personal: [plazos:read]
      parameters:
        - $ref: '#/components/parameters/CasoId'
      responses:
        '200':
          description: Los plazos del caso.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlazoResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /plazos:
    get:
      tags: [Plazos]
      operationId: listarPlazos
      summary: Plazos legales del tenant.
      description: |
        Paginados y ordenados por vencimiento, solo del tenant del token y solo para un actor ARL. La consulta queda
        auditada (`LEER / PLAZO`).
      security:
        - personal: [plazos:read]
      parameters:
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [ABIERTO, CUMPLIDO, VENCIDO, SUSPENDIDO] }
        - name: venceAntesDe
          in: query
          required: false
          description: Solo los que vencen antes de este instante (exclusivo).
          schema: { type: string, format: date-time }
        - name: regla
          in: query
          required: false
          schema: { type: string, example: INVESTIGACION_AT }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Una página de plazos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPlazos' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /casos/{casoId}/plazos/{plazoId}/cumplir:
    post:
      tags: [Plazos]
      operationId: cumplirPlazo
      summary: Marca un plazo como cumplido, con una nota.
      description: |
        Solo desde `ABIERTO` o `VENCIDO`. Uno vencido, o cumplido después de `venceEn`, queda `extemporaneo`. Sin
        `cumplidoEn`, se toma el instante de la solicitud; no puede ser futuro (`Plazo.CumplidoEnFuturo`). El
        cumplimiento queda auditado (`ACTUALIZAR / PLAZO`).
      security:
        - personal: [plazos:write]
      parameters:
        - $ref: '#/components/parameters/CasoId'
        - name: plazoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CumplirPlazoRequest' }
      responses:
        '204': { description: Plazo cumplido. }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: El plazo no existe, no es del caso o no es del tenant (`Plazo.NoEncontrado`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: El plazo ya no está `ABIERTO` ni `VENCIDO` (`Plazo.NoCumplible`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /casos/{casoId}/codigos-activacion:
    post:
      tags: [Paciente]
      operationId: emitirCodigoActivacion
      summary: Emite un código de activación del portal para el trabajador del caso.
      description: |
        Solo para un caso `Validado` o posterior (`Paciente.CasoNoValidado`). Emitir otro para el mismo caso vence el
        `ACTIVO` anterior. El código completo se muestra una sola vez: en la base solo quedan su sal y su hash. Vale 30
        días. La emisión queda auditada (`CREAR / CODIGO_ACTIVACION`).
      security:
        - personal: [pacientes:activar]
        - integracion: [pacientes:activar]
      parameters:
        - $ref: '#/components/parameters/CasoId'
      responses:
        '201':
          description: El código emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodigoActivacionResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El caso no está `Validado` ni en un estado posterior (`Paciente.CasoNoValidado`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /paciente/vinculos:
    post:
      tags: [Paciente]
      operationId: canjearCodigoActivacion
      summary: Vincula la cuenta del paciente al documento del trabajador con un código de activación.
      description: |
        El vínculo es por documento: la cuenta ve los casos de ese documento en cualquier ARL. Cada intento queda
        auditado (`CREAR / VINCULO`) con su resultado. Límites: 5 secretos equivocados bloquean el código, y 5 canjes
        fallidos de la misma cuenta en 24 h bloquean la cuenta para canjear, aunque el código sea válido.
      security:
        - paciente: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanjearCodigoRequest' }
      responses:
        '201':
          description: La cuenta quedó vinculada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VinculoCreadoResponse' }
        '400':
          description: |
            `Paciente.CodigoInvalido`, el mismo para un código inexistente, vencido, usado o mal tecleado: no se pueden
            enumerar códigos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409':
          description: La cuenta ya está vinculada a otro documento (`Paciente.VinculoDistinto`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '423':
          description: El código acumuló 5 secretos equivocados (`Paciente.CodigoBloqueado`). La ARL puede emitir otro.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429':
          description: La cuenta acumuló 5 canjes fallidos en 24 h (`Paciente.DemasiadosIntentos`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /paciente/mis-casos:
    get:
      tags: [Paciente]
      operationId: listarMisCasos
      summary: Los casos del paciente.
      description: Los casos de los documentos vinculados, de cualquier ARL. Sin vínculo, `[]`.
      security:
        - paciente: []
      responses:
        '200':
          description: Los casos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CasoPacienteResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /paciente/resumen:
    get:
      tags: [Paciente]
      operationId: obtenerResumenPaciente
      summary: El resumen del paciente.
      description: |
        Los casos activos (ni cerrados ni rechazados), las incapacidades vigentes hoy (en Colombia) y los próximos hitos:
        el fin de cada incapacidad vigente y el vencimiento de la controversia de un dictamen notificado. Sin el estado de
        los pagos (la liquidación está fuera de ARQ 01).
      security:
        - paciente: []
      responses:
        '200':
          description: El resumen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenPacienteResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /paciente/casos/{casoId}/linea-tiempo:
    get:
      tags: [Paciente]
      operationId: obtenerLineaTiempoPaciente
      summary: La línea de tiempo de un caso del paciente.
      description: |
        Los hitos administrativos del caso, del más antiguo al más reciente. **Sin** diagnósticos, porcentajes ni
        fundamentos: el detalle clínico sigue el flujo formal de copia. La consulta queda auditada (`LEER / CASO`).
      security:
        - paciente: []
      parameters:
        - $ref: '#/components/parameters/CasoId'
      responses:
        '200':
          description: Los hitos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HitoResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: El caso no existe o no es de un documento vinculado. No se distingue entre ambos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /paciente/incapacidades:
    get:
      tags: [Paciente]
      operationId: listarIncapacidadesPaciente
      summary: Las incapacidades del paciente.
      description: Todas las de los casos vinculados, de la más reciente a la más antigua, sin diagnóstico.
      security:
        - paciente: []
      responses:
        '200':
          description: Las incapacidades.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncapacidadPacienteResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /paciente/casos/{casoId}/solicitudes-copia-hc:
    post:
      tags: [Paciente]
      operationId: crearSolicitudCopiaHc
      summary: Solicita la copia de la historia clínica de un caso.
      description: |
        La atiende la ARL del caso por el canal formal; el portal nunca entrega la copia. Abre el plazo
        `SOLICITUD_COPIA_HC` (10 días hábiles, pendiente de validación jurídica). La creación queda auditada
        (`CREAR / SOLICITUD_COPIA_HC`).
      security:
        - paciente: []
      parameters:
        - $ref: '#/components/parameters/CasoId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearSolicitudCopiaHcRequest' }
      responses:
        '201':
          description: La solicitud, `RECIBIDA`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudCopiaHcPacienteResponse' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: El caso no existe o no es de un documento vinculado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: Ya hay una solicitud abierta (`RECIBIDA` o `EN_TRAMITE`) para el caso (`SolicitudCopiaHc.YaAbierta`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /paciente/solicitudes-copia-hc:
    get:
      tags: [Paciente]
      operationId: listarSolicitudesCopiaHcPaciente
      summary: Las solicitudes de copia de la HC del paciente.
      security:
        - paciente: []
      responses:
        '200':
          description: Las solicitudes, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SolicitudCopiaHcPacienteResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /solicitudes-copia-hc:
    get:
      tags: [SolicitudesCopiaHc]
      operationId: listarSolicitudesCopiaHc
      summary: La bandeja de solicitudes de copia de la HC del tenant.
      description: |
        De la más antigua a la más reciente (el orden en que corre su plazo). Solo personal de la ARL. La consulta queda
        auditada (`LEER / SOLICITUD_COPIA_HC`).
      security:
        - personal: [solicitudes-hc:gestionar]
      parameters:
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [RECIBIDA, EN_TRAMITE, ENTREGADA, RECHAZADA] }
      responses:
        '200':
          description: Las solicitudes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SolicitudCopiaHcResponse' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /solicitudes-copia-hc/{id}/tramitar:
    post:
      tags: [SolicitudesCopiaHc]
      operationId: tramitarSolicitudCopiaHc
      summary: Pasa la solicitud de `RECIBIDA` a `EN_TRAMITE`.
      description: La gestión queda auditada (`ACTUALIZAR / SOLICITUD_COPIA_HC`).
      security:
        - personal: [solicitudes-hc:gestionar]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Solicitud en trámite. }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: La solicitud no existe o no es del tenant (`SolicitudCopiaHc.NoEncontrada`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: La solicitud no está `RECIBIDA` (`SolicitudCopiaHc.TransicionInvalida`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /solicitudes-copia-hc/{id}/cerrar:
    post:
      tags: [SolicitudesCopiaHc]
      operationId: cerrarSolicitudCopiaHc
      summary: Cierra la solicitud como `ENTREGADA` o `RECHAZADA` y cumple su plazo.
      description: |
        Desde `RECIBIDA` o `EN_TRAMITE`. En la misma transacción cumple el plazo `SOLICITUD_COPIA_HC` (extemporáneo si ya
        venció). La gestión queda auditada (`ACTUALIZAR / SOLICITUD_COPIA_HC`).
      security:
        - personal: [solicitudes-hc:gestionar]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CerrarSolicitudCopiaHcRequest' }
      responses:
        '204': { description: Solicitud cerrada. }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: La solicitud no existe o no es del tenant (`SolicitudCopiaHc.NoEncontrada`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: La solicitud ya estaba cerrada (`SolicitudCopiaHc.TransicionInvalida`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

webhooks:
  plazoProximoAVencer:
    post:
      summary: "Evento saliente (ARL): plazo legal próximo a vencer."
      description: |
        Contrato común a los 10 webhooks salientes (SPEC 10). Se entregan a la URL de cada suscripción `ACTIVA` del
        destinatario que incluya el tipo, como `POST` con `Content-Type: application/json`, timeout de 10 s y sin seguir
        redirecciones.

        - **At-least-once.** El mismo evento puede llegar más de una vez: el receptor deduplica por `eventoId`, que es
          el de `Halsa-Event-Id` y no cambia entre reintentos.
        - **Firma.** `Halsa-Signature: t=<unix>,v1=<hex(HMAC-SHA256(secreto, t + "." + cuerpo))>`, sobre el cuerpo
          exacto recibido. Durante las 24 h siguientes a `rotar-secreto` llegan dos `v1`: primero el del secreto nuevo y
          después el del anterior; basta con que uno coincida. El receptor debe rechazar un `t` de más de 5 minutos.
        - **Reintentos.** Cualquier respuesta que no sea `2xx` (también un `3xx`), un timeout o un error de red se
          reintenta con backoff exponencial y jitter, `min(2^intentos × 30 s, 4 h) ± 20 %`, durante 24 h desde el primer
          intento; después la entrega queda en `DEAD_LETTER` y se puede reenviar por API. 50 fallos seguidos suspenden la
          suscripción.
        - **Sin datos clínicos.** Ningún evento lleva diagnósticos, contenido clínico ni fundamentos.

        Destinatario ARL: `plazo.proximo-a-vencer`, `plazo.vencido`, `caso.validado`, `caso.rechazado`,
        `incapacidad.registrada`, `concepto.registrado`, `dictamen.notificado` y `auditoria.acceso-emergencia`.
        Destinatario IPS: `caso.remitido` y `remision.revocada`.
      parameters:
        - $ref: '#/components/parameters/HalsaSignature'
        - $ref: '#/components/parameters/HalsaEventId'
        - $ref: '#/components/parameters/HalsaEventType'
        - $ref: '#/components/parameters/HalsaDeliveryAttempt'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoPlazo' }
      responses:
        '2XX': { description: Recibido. }
