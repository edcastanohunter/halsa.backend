components:
  securitySchemes:
    personal:
      type: oauth2
      description: Realm `halsa`, client `halsa-backoffice` (Authorization Code + PKCE). Audiencia `halsa-api`.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.halsa.co/realms/halsa/protocol/openid-connect/auth
          tokenUrl: https://auth.halsa.co/realms/halsa/protocol/openid-connect/token
          scopes:
            clinico:read: Leer la historia clínica y descargar los soportes de los casos asignados
            clinico:write: Registrar conceptos médicos, evoluciones y conceptos de rehabilitación
            clinico:emergencia: Leer la historia clínica de un caso sin estar asignado (break-the-glass), con motivo y revisión
            incapacidades:read: Consultar las incapacidades de un caso
            incapacidades:write: Cargar incapacidades
            pcl:dictamen:read: Leer dictámenes PCL
            pcl:dictamen:write: Registrar, corregir y notificar dictámenes PCL
            auditoria:revisar: Revisar y cerrar los accesos de emergencia
            pacientes:activar: Emitir códigos de activación del portal del paciente
            solicitudes-hc:gestionar: Gestionar la bandeja de solicitudes de copia de la HC
    integracion:
      type: oauth2
      description: Realm `halsa`, clients `int-arl-*` o `int-ips-*`. Client Credentials con `private_key_jwt` y token ligado a certificado mTLS (RFC 8705).
      flows:
        clientCredentials:
          tokenUrl: https://auth.halsa.co/realms/halsa/protocol/openid-connect/token
          scopes:
            integracion:furat:write: Radicar FURAT
            integracion:furep:write: Radicar FUREP
            integracion:clinico:write: Enviar conceptos médicos desde una IPS
            incapacidades:write: Cargar incapacidades
            webhooks:manage: Gestionar las suscripciones a webhooks salientes (ARL e IPS)
            pacientes:activar: Emitir códigos de activación del portal del paciente (solo ARL)
    paciente:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Realm `halsa-pacientes`. El navegador nunca ve este token: el BFF `halsa-bff-paciente` (client confidencial,
        Authorization Code + PKCE) lo guarda en su sesión y lo añade al reenviar `/paciente/api/*` a `/v1/paciente/*`.
        Audiencia `halsa-api`. Un token del realm `halsa` responde `403` en estas rutas.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el emisor. Se conserva 72 h. Reutilizarlo con otro cuerpo devuelve `409`.
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Se propaga a los logs y a la auditoría. Si falta, la API genera uno y lo devuelve.
      schema: { type: string, maxLength: 64 }
    MotivoAcceso:
      name: Halsa-Motivo-Acceso
      in: header
      required: false
      description: |
        Solo para el acceso de emergencia (break-the-glass): con el permiso `clinico:emergencia`, un profesional no
        asignado lee el caso si justifica el acceso con entre 20 y 500 caracteres (si no, `403` con
        `Clinico.MotivoEmergenciaInvalido`). Nunca salta el tenant ni la remisión. El motivo queda en
        `auditoria.accesos` y abre una revisión que vence a las 72 h; los accesos del mismo actor al mismo caso en 1 h
        comparten la revisión. Un profesional asignado puede enviarlo: se ignora.
      schema: { type: string, minLength: 20, maxLength: 500 }
    CasoId:
      name: casoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HalsaSignature:
      name: Halsa-Signature
      in: header
      required: true
      description: |
        `t=<unix>,v1=<hex(HMAC-SHA256(secreto, t + "." + cuerpo))>`. Durante las 24 h siguientes a una rotación, un
        segundo `v1` con el secreto anterior.
      schema: { type: string, example: 't=1760050000,v1=5f2b...e9' }
    HalsaEventId:
      name: Halsa-Event-Id
      in: header
      required: true
      description: El `eventoId` del cuerpo. Estable entre reintentos; el receptor deduplica por él.
      schema: { type: string, format: uuid }
    HalsaEventType:
      name: Halsa-Event-Type
      in: header
      required: true
      description: El `tipo` del cuerpo.
      schema: { type: string, example: plazo.vencido }
    HalsaDeliveryAttempt:
      name: Halsa-Delivery-Attempt
      in: header
      required: true
      description: El número de este intento de entrega, desde 1.
      schema: { type: integer, minimum: 1 }

  schemas:
    # ---------- Tipos base ----------
    Codificado:
      type: object
      description: Código de una terminología externa. Se mapea a FHIR `Coding`.
      required: [sistema, codigo]
      properties:
        sistema:
          type: string
          enum: [CIE-10, CIIU-4AC, DIVIPOLA, RES156-TIPO-LESION, RES156-PARTE-CUERPO, RES156-AGENTE, RES156-MECANISMO, CIUO-08AC]
        codigo: { type: string, maxLength: 20 }
        descripcion: { type: string, maxLength: 250 }

    Identificacion:
      type: object
      required: [tipo, numero]
      properties:
        tipo:
          type: string
          description: |
            Tipo de documento: CC = cédula de ciudadanía, CE = cédula de extranjería, TI = tarjeta de identidad,
            PA = pasaporte, PE = permiso especial de permanencia, PT = permiso por protección temporal, NIT = número de identificación tributaria.
          enum: [CC, CE, TI, PA, PE, PT, NIT]
        numero: { type: string, pattern: '^[A-Za-z0-9]{3,20}$' }

    Ubicacion:
      type: object
      required: [municipio, zona]
      properties:
        municipio:
          allOf: [{ $ref: '#/components/schemas/Codificado' }]
          description: Código DIVIPOLA de 5 dígitos (`sistema=DIVIPOLA`).
        zona: { type: string, enum: [URBANA, RURAL] }
        direccion: { type: string, maxLength: 200 }

    # ---------- FURAT ----------
    FuratRequest:
      type: object
      description: |
        Estructura del FURAT (Res. 156/2005) normalizada. Los campos marcados con `x-clasificacion: clinico`
        se separan en la ingesta y se guardan cifrados en el esquema `clinico`.
      required: [version, numeroReporteOrigen, empleador, trabajador, evento, informante]
      properties:
        version: { type: string, const: '1.0' }
        numeroReporteOrigen:
          type: string
          maxLength: 40
          description: Identificador del reporte en el core de la ARL. Es la clave de negocio para deduplicar.
        fechaReporte: { type: string, format: date-time }
        empleador:
          type: object
          required: [identificacion, razonSocial, actividadEconomica, sede]
          properties:
            identificacion: { $ref: '#/components/schemas/Identificacion' }
            razonSocial: { type: string, maxLength: 200 }
            tipoVinculador: { type: string, enum: [EMPLEADOR, CONTRATANTE, COOPERATIVA, EMPRESA_SERVICIOS_TEMPORALES] }
            actividadEconomica:
              allOf: [{ $ref: '#/components/schemas/Codificado' }]
              description: Código de actividad económica para riesgos laborales (`sistema=CIIU-4AC`).
            sede:
              type: object
              required: [ubicacion]
              properties:
                nombre: { type: string, maxLength: 120 }
                ubicacion: { $ref: '#/components/schemas/Ubicacion' }
                telefono: { type: string, maxLength: 20 }
        trabajador:
          type: object
          required: [identificacion, primerNombre, primerApellido, fechaNacimiento, sexo, tipoVinculacion, cargo, fechaIngreso]
          properties:
            identificacion: { $ref: '#/components/schemas/Identificacion' }
            primerNombre: { type: string, maxLength: 60 }
            segundoNombre: { type: string, maxLength: 60 }
            primerApellido: { type: string, maxLength: 60 }
            segundoApellido: { type: string, maxLength: 60 }
            fechaNacimiento: { type: string, format: date }
            sexo: { type: string, enum: [F, M, I] }
            tipoVinculacion: { type: string, enum: [PLANTA, MISION, COOPERADO, ESTUDIANTE_APRENDIZ, INDEPENDIENTE] }
            cargo: { type: string, maxLength: 120 }
            ocupacion: { $ref: '#/components/schemas/Codificado' }
            fechaIngreso: { type: string, format: date }
            jornadaHabitual: { type: string, enum: [DIURNA, NOCTURNA, MIXTA, TURNOS] }
            contacto:
              type: object
              properties:
                telefono: { type: string, maxLength: 20 }
                correo: { type: string, format: email }
        evento:
          type: object
          required: [fechaHora, jornada, realizabaLaborHabitual, tipo, causoMuerte, lugar, ubicacion, descripcion]
          properties:
            fechaHora:
              type: string
              format: date-time
              description: Instante del accidente con zona horaria (`-05:00`). No puede ser futuro.
            diaSemana: { type: string, readOnly: true, description: Lo calcula el servidor. }
            jornada: { type: string, enum: [NORMAL, EXTRA] }
            realizabaLaborHabitual: { type: boolean }
            laborRealizada: { type: string, maxLength: 200 }
            tiempoLaboradoPrevioMinutos: { type: integer, minimum: 0 }
            tipo: { type: string, enum: [PROPIO_DEL_TRABAJO, VIOLENCIA, TRANSITO, DEPORTIVO, RECREATIVO_CULTURAL] }
            causoMuerte: { type: boolean }
            esGrave:
              type: boolean
              description: Según la definición de la Res. 1401/2007. Activa el plazo `REMISION_INVESTIGACION_GRAVE`.
            lugar: { type: string, enum: [DENTRO_EMPRESA, FUERA_EMPRESA] }
            sitio: { type: string, enum: [ALMACEN, CORREDOR, PARQUEADERO, OFICINA, PLANTA, VIA_PUBLICA, OTRO] }
            ubicacion: { $ref: '#/components/schemas/Ubicacion' }
            tiposLesion:
              type: array
              x-clasificacion: clinico
              items: { $ref: '#/components/schemas/Codificado' }
            partesCuerpo:
              type: array
              x-clasificacion: clinico
              items: { $ref: '#/components/schemas/Codificado' }
            agente: { $ref: '#/components/schemas/Codificado' }
            mecanismo: { $ref: '#/components/schemas/Codificado' }
            descripcion:
              type: string
              minLength: 20
              maxLength: 4000
              x-clasificacion: clinico
              description: Relato del evento. Puede contener información de salud, así que se cifra.
        testigos:
          type: array
          maxItems: 5
          items:
            type: object
            required: [identificacion, nombreCompleto]
            properties:
              identificacion: { $ref: '#/components/schemas/Identificacion' }
              nombreCompleto: { type: string, maxLength: 200 }
              cargo: { type: string, maxLength: 120 }
        informante:
          type: object
          required: [identificacion, nombreCompleto, cargo, fechaDiligenciamiento]
          properties:
            identificacion: { $ref: '#/components/schemas/Identificacion' }
            nombreCompleto: { type: string, maxLength: 200 }
            cargo: { type: string, maxLength: 120 }
            fechaDiligenciamiento: { type: string, format: date-time }
        ipsAtencionInicial:
          type: object
          properties:
            codigoReps: { type: string, pattern: '^[0-9]{10,12}$' }
            nombre: { type: string, maxLength: 200 }

    # ---------- FUREP ----------
    FurepRequest:
      type: object
      required: [version, numeroReporteOrigen, empleador, trabajador, enfermedad, informante]
      properties:
        version: { type: string, const: '1.0' }
        numeroReporteOrigen: { type: string, maxLength: 40 }
        empleador: { $ref: '#/components/schemas/FuratRequest/properties/empleador' }
        trabajador: { $ref: '#/components/schemas/FuratRequest/properties/trabajador' }
        informante: { $ref: '#/components/schemas/FuratRequest/properties/informante' }
        enfermedad:
          type: object
          required: [fechaDiagnostico, diagnosticos, medicoDiagnostica]
          properties:
            fechaDiagnostico: { type: string, format: date }
            diagnosticos:
              type: array
              minItems: 1
              x-clasificacion: clinico
              items: { $ref: '#/components/schemas/Codificado' }
            factoresRiesgo:
              type: array
              items:
                type: object
                properties:
                  descripcion: { type: string, maxLength: 300 }
                  tiempoExposicionMeses: { type: integer, minimum: 0 }
            medicoDiagnostica: { $ref: '#/components/schemas/Profesional' }

    RadicacionResponse:
      type: object
      required: [solicitudId, radicado, estado, recibidoEn]
      properties:
        solicitudId: { type: string, format: uuid }
        casoId: { type: string, format: uuid }
        radicado: { type: string, example: ATEL-POS-2026-000123 }
        estado: { type: string, enum: [RADICADO, VALIDADO, RECHAZADO, DUPLICADO] }
        recibidoEn: { type: string, format: date-time }
        plazos:
          type: array
          description: |
            Los plazos `ABIERTO` del caso (SPEC 09). Vacío en el `202`: se abren de forma asíncrona y los muestra la
            consulta de estado.
          items: { $ref: '#/components/schemas/PlazoResumen' }
        motivoRechazo: { $ref: '#/components/schemas/Problema' }

    # ---------- Incapacidad ----------
    IncapacidadRequest:
      type: object
      required: [numeroCertificado, tipo, fechaInicio, dias, diagnosticoPrincipal, ipsEmisora, modalidad]
      properties:
        numeroCertificado: { type: string, maxLength: 40 }
        tipo: { type: string, enum: [INICIAL, PRORROGA] }
        prorrogaDe:
          type: string
          format: uuid
          description: Obligatorio si `tipo=PRORROGA`. Es el id de la incapacidad anterior del mismo caso.
        fechaInicio: { type: string, format: date }
        dias:
          type: integer
          minimum: 1
          maximum: 30
          description: Días calendario. La fecha fin la calcula el servidor (`fechaInicio + dias - 1`) para evitar inconsistencias.
        diagnosticoPrincipal:
          allOf: [{ $ref: '#/components/schemas/Codificado' }]
          x-clasificacion: clinico
          description: Código CIE-10 (`sistema=CIE-10`). Se cifra y nunca se devuelve en la respuesta.
        diagnosticosRelacionados:
          type: array
          maxItems: 3
          x-clasificacion: clinico
          items: { $ref: '#/components/schemas/Codificado' }
        profesional:
          allOf: [{ $ref: '#/components/schemas/Profesional' }]
          description: |
            Obligatorio en la integración. En el backoffice se ignora: el profesional sale de los claims del token.
        ipsEmisora:
          type: object
          required: [codigoReps]
          properties:
            codigoReps: { type: string, pattern: '^[0-9]{10,12}$' }
            nombre: { type: string, maxLength: 200 }
        modalidad: { type: string, enum: [PRESENCIAL, TELEMEDICINA] }
        observaciones:
          type: string
          maxLength: 1000
          x-clasificacion: clinico

    IncapacidadResponse:
      type: object
      description: Solo datos administrativos. No incluye diagnósticos, observaciones ni el profesional.
      required: [id, casoId, tipo, fechaInicio, fechaFin, dias, diasAcumulados, estado, soporteId, alertas]
      properties:
        id: { type: string, format: uuid }
        casoId: { type: string, format: uuid }
        tipo: { type: string, enum: [INICIAL, PRORROGA] }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        dias: { type: integer }
        diasAcumulados:
          type: integer
          description: Suma de los días de la cadena inicial + prórrogas del caso.
        estado:
          type: string
          enum: [REGISTRADA]
          description: Por ahora solo `REGISTRADA`. Los estados de revisión y pago pertenecen a la liquidación.
        soporteId: { type: string, format: uuid }
        alertas:
          type: array
          description: Se calculan en cada respuesta y no bloquean la carga.
          items:
            type: object
            required: [code, mensaje]
            properties:
              code:
                type: string
                enum: [ACUMULADO_150_DIAS, ACUMULADO_180_DIAS, ACUMULADO_540_DIAS, CARGA_EXTEMPORANEA]
                description: |
                  Umbrales de la Ley 776/2002.
                  - `ACUMULADO_150_DIAS`: alerta temprana.
                  - `ACUMULADO_180_DIAS`: se requiere concepto de rehabilitación para la prórroga.
                  - `ACUMULADO_540_DIAS`: alerta de seguimiento de largo plazo, pendiente de validación jurídica.
                  - `CARGA_EXTEMPORANEA`: el certificado se cargó más de 30 días (configurable) después de su inicio.
              mensaje: { type: string }

    # ---------- Clínico ----------
    Profesional:
      type: object
      required: [identificacion, nombreCompleto, registroRethus]
      properties:
        identificacion: { $ref: '#/components/schemas/Identificacion' }
        nombreCompleto: { type: string, maxLength: 200 }
        registroRethus: { type: string, maxLength: 30 }
        especialidad: { type: string, maxLength: 120 }

    ContenidoClinico:
      type: object
      description: |
        El texto clínico de un concepto, igual en los dos canales de carga. Al menos uno entre `motivo`, `anamnesis`,
        `examenFisico`, `analisis` y `plan` tiene texto. Se cifra con la DEK del tenant del caso antes de guardarse.
      properties:
        motivo: { type: [string, 'null'], maxLength: 8000 }
        anamnesis: { type: [string, 'null'], maxLength: 8000 }
        examenFisico: { type: [string, 'null'], maxLength: 8000 }
        analisis: { type: [string, 'null'], maxLength: 8000 }
        plan: { type: [string, 'null'], maxLength: 8000 }
        diagnosticos:
          type: [array, 'null']
          description: |
            Solo CIE-10, validado por formato (el catálogo va en su propia spec). El primero es el diagnóstico
            principal. La historia guarda el sistema y el código.
          items:
            type: object
            required: [sistema, codigo]
            properties:
              sistema: { type: string, const: CIE-10 }
              codigo: { type: string, pattern: '^[A-Z][0-9]{2}(\.[0-9A-Z]{1,4})?$', example: S62.6 }
              descripcion: { type: [string, 'null'], maxLength: 250 }
        observaciones: { type: [string, 'null'], maxLength: 8000 }

    RegistroClinicoRequest:
      type: object
      description: El cuerpo del backoffice. El profesional sale del token.
      required: [tipo, atendidoEn, contenido]
      properties:
        tipo: { type: string, enum: [CONCEPTO_MEDICO, EVOLUCION, CONCEPTO_REHABILITACION] }
        atendidoEn:
          type: string
          format: date-time
          description: |
            Cuándo se atendió al paciente. No puede ser futuro, ni anterior en más de un día a la fecha del evento del
            caso (`Clinico.FechaAtencionAnteriorAlEvento`).
        corrigeA:
          type: [string, 'null']
          format: uuid
          description: El registro del mismo caso que este corrige. Si no existe o no es visible, `404`.
        contenido: { $ref: '#/components/schemas/ContenidoClinico' }

    ConceptoMedicoRequest:
      type: object
      description: El cuerpo de la integración de una IPS. Lleva el caso y el profesional que firma.
      required: [version, casoId, tipo, atendidoEn, profesional, contenido]
      properties:
        version: { type: string, const: '1.0' }
        casoId: { type: string, format: uuid }
        tipo: { type: string, enum: [CONCEPTO_MEDICO, EVOLUCION, CONCEPTO_REHABILITACION] }
        atendidoEn:
          type: string
          format: date-time
          description: Igual que en `RegistroClinicoRequest`.
        corrigeA: { type: [string, 'null'], format: uuid }
        profesional: { $ref: '#/components/schemas/Profesional' }
        contenido: { $ref: '#/components/schemas/ContenidoClinico' }

    RegistroClinicoCreadoResponse:
      type: object
      required: [registroId, casoId, registradoEn]
      properties:
        registroId: { type: string, format: uuid }
        casoId: { type: string, format: uuid }
        registradoEn: { type: string, format: date-time }

    RegistroClinicoResponse:
      type: object
      description: |
        Un registro de la historia clínica, descifrado (SPEC 08). Nunca un `DICTAMEN_PCL`. El profesional es el que firmó
        el registro; su nombre no se guarda en la historia clínica.
      required: [id, casoId, tipo, profesional, atendidoEn, registradoEn, retenerHasta, contenido]
      properties:
        id: { type: string, format: uuid }
        casoId: { type: string, format: uuid }
        tipo: { type: string, enum: [REPORTE_INICIAL, CONCEPTO_MEDICO, EVOLUCION, CONCEPTO_REHABILITACION, CERTIFICADO_INCAPACIDAD] }
        profesional: { $ref: '#/components/schemas/ProfesionalFirma' }
        atendidoEn: { type: string, format: date-time }
        registradoEn: { type: string, format: date-time }
        retenerHasta:
          type: string
          format: date
          description: Res. 839/2017, 15 años desde el registro.
        corrigeA: { type: [string, 'null'], format: uuid }
        corregidoPor:
          type: [string, 'null']
          format: uuid
          description: La corrección más reciente de este registro, si la hay.
        contenido: { $ref: '#/components/schemas/ContenidoClinico' }

    ProfesionalFirma:
      type: object
      description: Quien firma un registro clínico. `registroRethus` solo es nulo en un `REPORTE_INICIAL`.
      required: [sub, tipoDocumento, numeroDocumento]
      properties:
        sub:
          type: string
          description: El `sub` del token del backoffice, o la service account de la integración.
        tipoDocumento: { type: string, maxLength: 10 }
        numeroDocumento: { type: string, maxLength: 30 }
        registroRethus: { type: [string, 'null'], maxLength: 30 }

    RegistrarDictamenPclRequest:
      type: object
      description: El calificador sale del token, nunca del cuerpo.
      required: [porcentajePcl, origen, fechaEstructuracion, fechaDictamen, fundamentos, diagnosticos]
      properties:
        porcentajePcl: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        origen: { type: string, enum: [LABORAL, COMUN, MIXTO] }
        fechaEstructuracion:
          type: string
          format: date
          description: No puede ser posterior a `fechaDictamen` (`Dictamen.FechasInvalidas`).
        fechaDictamen:
          type: string
          format: date
          description: No puede ser futura (hoy en Colombia).
        componentes:
          type: [object, 'null']
          description: Si vienen, `deficiencias + rolLaboralYOtrasAreas = porcentajePcl` (±0,01; `Dictamen.ComponentesNoSuman`).
          required: [deficiencias, rolLaboralYOtrasAreas]
          properties:
            deficiencias: { type: number, minimum: 0 }
            rolLaboralYOtrasAreas: { type: number, minimum: 0 }
        fundamentos:
          type: string
          minLength: 50
          maxLength: 20000
          x-clasificacion: clinico
        diagnosticos:
          type: array
          minItems: 1
          x-clasificacion: clinico
          description: Solo CIE-10, validado por formato.
          items:
            type: object
            required: [sistema, codigo]
            properties:
              sistema: { type: string, const: CIE-10 }
              codigo: { type: string, pattern: '^[A-Z][0-9]{2}(\.[0-9A-Z]{1,4})?$', example: S62.6 }
              descripcion: { type: [string, 'null'], maxLength: 250 }
        corrigeA:
          type: [string, 'null']
          format: uuid
          description: El `id` del dictamen vigente, para corregirlo mientras esté `PENDIENTE`.

    NotificarDictamenPclRequest:
      type: object
      required: [notificadoEn, medio]
      properties:
        notificadoEn: { type: string, format: date-time }
        medio: { type: string, enum: [CORREO_CERTIFICADO, ELECTRONICO, PERSONAL] }

    Calificador:
      type: object
      description: El calificador del dictamen. `nombreCompleto` es el claim `name` del token, si lo traía.
      required: [identificacion, registroRethus]
      properties:
        identificacion: { $ref: '#/components/schemas/Identificacion' }
        nombreCompleto: { type: [string, 'null'], maxLength: 200 }
        registroRethus: { type: string, maxLength: 30 }

    DictamenPclResponse:
      type: object
      required: [id, casoId, porcentajePcl, origen, fechaEstructuracion, fechaDictamen, manual, fundamentos, diagnosticos, calificador, estadoNotificacion]
      properties:
        id:
          type: string
          format: uuid
          description: El que se indica en `corrigeA` para corregirlo.
        casoId: { type: string, format: uuid }
        porcentajePcl: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        origen: { type: string, enum: [LABORAL, COMUN, MIXTO] }
        fechaEstructuracion: { type: string, format: date }
        fechaDictamen: { type: string, format: date }
        manual: { type: string, const: 'Decreto 1507/2014' }
        componentes:
          type: [object, 'null']
          properties:
            deficiencias: { type: number }
            rolLaboralYOtrasAreas: { type: number }
        fundamentos:
          type: string
          description: Motivación clínica. Es el contenido más sensible del sistema.
        diagnosticos:
          type: array
          items:
            type: object
            required: [sistema, codigo]
            properties:
              sistema: { type: string }
              codigo: { type: string }
        calificador: { $ref: '#/components/schemas/Calificador' }
        estadoNotificacion: { type: string, enum: [PENDIENTE, NOTIFICADO, EN_CONTROVERSIA, EN_FIRME] }
        venceControversiaEn:
          type: [string, 'null']
          format: date
          description: |
            El día (en Colombia) en que vence `CONTROVERSIA_DICTAMEN`. Nulo hasta la notificación, y para un actor que no
            ve los plazos del tenant (una IPS). Al vencer sin controversia, el dictamen pasa a `EN_FIRME`.
        corrigeA:
          type: [string, 'null']
          format: uuid
          description: El dictamen que este corrigió, si lo hay.

    # ---------- Auditoría ----------
    RevisionEmergenciaResponse:
      type: object
      description: La revisión de un acceso de emergencia (break-the-glass). Vence a las 72 h de abrirse.
      required: [id, casoMedicoId, accesoId, actorId, motivo, ocurridoEn, venceRevisionEn, estado]
      properties:
        id: { type: string, format: uuid }
        casoMedicoId: { type: string, format: uuid }
        accesoId:
          type: string
          format: uuid
          description: La fila de `auditoria.accesos` que la abrió. Los accesos agrupados tienen su propia fila con el motivo.
        actorId: { type: string }
        motivo: { type: string, minLength: 20, maxLength: 500 }
        ocurridoEn: { type: string, format: date-time }
        venceRevisionEn: { type: string, format: date-time }
        estado: { type: string, enum: [PENDIENTE, CERRADA] }
        revisadoEn: { type: [string, 'null'], format: date-time }
        revisadoPor: { type: [string, 'null'] }
        conclusion: { type: [string, 'null'], enum: [JUSTIFICADO, INJUSTIFICADO, null] }
        observaciones: { type: [string, 'null'], maxLength: 2000 }

    PaginaRevisionesEmergencia:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RevisionEmergenciaResponse' }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }

    CerrarRevisionEmergenciaRequest:
      type: object
      required: [conclusion]
      properties:
        conclusion: { type: string, enum: [JUSTIFICADO, INJUSTIFICADO] }
        observaciones: { type: [string, 'null'], maxLength: 2000 }

    # ---------- Plazos ----------
    PlazoResponse:
      type: object
      required: [id, casoId, radicado, regla, baseLegal, iniciaEn, venceEn, alertaEn, estado, extemporaneo]
      properties:
        id: { type: string, format: uuid }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        regla:
          type: string
          example: INVESTIGACION_AT
          description: Código de `sst.reglas_termino`.
        baseLegal: { type: string, example: 'Res. 1401/2007; Decreto 1072/2015, art. 2.2.4.6.32' }
        referenciaId:
          type: [string, 'null']
          format: uuid
          description: La cadena de incapacidades (`TOPE_IT_180`) o el dictamen (`CONTROVERSIA_DICTAMEN`) del que cuelga.
        iniciaEn: { type: string, format: date-time }
        venceEn:
          type: string
          format: date-time
          description: Los términos en días vencen a las 23:59:59 (hora de Colombia) del último día.
        alertaEn: { type: string, format: date-time }
        estado: { type: string, enum: [ABIERTO, CUMPLIDO, VENCIDO, SUSPENDIDO] }
        extemporaneo:
          type: boolean
          description: Se cumplió, o la radicación llegó, después de `venceEn`.
        cumplidoEn: { type: [string, 'null'], format: date-time }

    PaginaPlazos:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlazoResponse' }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }

    CumplirPlazoRequest:
      type: object
      required: [nota]
      properties:
        nota: { type: string, minLength: 10, maxLength: 1000 }
        cumplidoEn:
          type: [string, 'null']
          format: date-time
          description: Sin valor, el instante de la solicitud.

    # ---------- Portal del paciente (SPEC 12) ----------
    CodigoActivacionResponse:
      type: object
      required: [codigo, expiraEn]
      properties:
        codigo:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{6}-[0-9A-HJKMNP-TV-Z]{10}$'
          example: ABC123-K7Q2M9XD4P
          description: El id (6) y el secreto (10, unos 50 bits), en base32 de Crockford. Se muestra una sola vez.
        expiraEn: { type: string, format: date-time }

    CanjearCodigoRequest:
      type: object
      required: [codigo]
      properties:
        codigo:
          type: string
          example: ABC123-K7Q2M9XD4P
          description: Sin distinguir mayúsculas; los espacios se ignoran, y `O`, `I` y `L` se leen como `0`, `1` y `1`.

    VinculoCreadoResponse:
      type: object
      required: [trabajador]
      properties:
        trabajador: { $ref: '#/components/schemas/TrabajadorVinculadoResponse' }

    TrabajadorVinculadoResponse:
      type: object
      required: [tipo, numeroEnmascarado]
      properties:
        tipo: { type: string, example: CC }
        numeroEnmascarado: { type: string, example: '******4050' }

    CasoPacienteResponse:
      type: object
      required: [casoId, radicado, tipoEvento, estado, fechaEvento, arl, ultimoHitoEn]
      properties:
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        tipoEvento: { type: string, enum: [AccidenteTrabajo, EnfermedadLaboral] }
        estado: { type: string, example: Validado }
        fechaEvento: { type: string, format: date-time }
        arl:
          type: string
          example: ARL_A
          description: El código de la ARL del caso.
        ultimoHitoEn:
          type: string
          format: date-time
          description: La fecha del hito más reciente de su línea de tiempo.

    ResumenPacienteResponse:
      type: object
      required: [casosActivos, incapacidadesVigentes, proximosHitos]
      properties:
        casosActivos:
          type: array
          items: { $ref: '#/components/schemas/CasoPacienteResponse' }
        incapacidadesVigentes:
          type: array
          items: { $ref: '#/components/schemas/IncapacidadVigenteResponse' }
        proximosHitos:
          type: array
          items: { $ref: '#/components/schemas/ProximoHitoResponse' }

    IncapacidadVigenteResponse:
      type: object
      required: [casoId, fechaInicio, fechaFin, dias]
      properties:
        casoId: { type: string, format: uuid }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        dias: { type: integer }

    ProximoHitoResponse:
      type: object
      required: [casoId, tipo, fecha]
      properties:
        casoId: { type: string, format: uuid }
        tipo: { type: string, enum: [FIN_INCAPACIDAD, VENCE_CONTROVERSIA] }
        fecha: { type: string, format: date }

    HitoResponse:
      type: object
      required: [tipo, fecha, descripcion]
      properties:
        tipo:
          type: string
          enum: [RADICADO, VALIDADO, RECHAZADO, REMITIDO_A_IPS, INCAPACIDAD_REGISTRADA, DICTAMEN_NOTIFICADO, DICTAMEN_EN_FIRME]
        fecha: { type: string, format: date-time }
        descripcion: { type: string, example: La ARL validó la radicación del caso. }

    IncapacidadPacienteResponse:
      type: object
      required: [id, casoId, tipo, fechaInicio, fechaFin, dias, diasAcumulados, estado]
      properties:
        id: { type: string, format: uuid }
        casoId: { type: string, format: uuid }
        tipo: { type: string, enum: [INICIAL, PRORROGA] }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        dias: { type: integer }
        diasAcumulados: { type: integer }
        estado: { type: string, enum: [REGISTRADA] }

    CrearSolicitudCopiaHcRequest:
      type: object
      required: [medioEntrega]
      properties:
        medioEntrega: { type: string, enum: [CORREO_CERTIFICADO, PRESENCIAL, ELECTRONICO] }
        direccionOCorreo:
          type: [string, 'null']
          maxLength: 500
          description: Obligatorio salvo con `PRESENCIAL`; un correo con `ELECTRONICO`.
        observaciones: { type: [string, 'null'], maxLength: 1000 }

    SolicitudCopiaHcPacienteResponse:
      type: object
      required: [id, casoId, medioEntrega, estado, solicitadaEn]
      properties:
        id: { type: string, format: uuid }
        casoId: { type: string, format: uuid }
        medioEntrega: { type: string, enum: [CORREO_CERTIFICADO, PRESENCIAL, ELECTRONICO] }
        direccionOCorreo: { type: [string, 'null'] }
        observaciones: { type: [string, 'null'] }
        estado: { type: string, enum: [RECIBIDA, EN_TRAMITE, ENTREGADA, RECHAZADA] }
        solicitadaEn: { type: string, format: date-time }
        atendidaEn: { type: [string, 'null'], format: date-time }
        notaAtencion:
          type: [string, 'null']
          description: La nota del cierre de la ARL.

    SolicitudCopiaHcResponse:
      type: object
      required: [id, casoId, radicado, pacienteSub, medioEntrega, estado, solicitadaEn]
      properties:
        id: { type: string, format: uuid }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        pacienteSub:
          type: string
          description: La cuenta de `halsa-pacientes` que la hizo.
        medioEntrega: { type: string, enum: [CORREO_CERTIFICADO, PRESENCIAL, ELECTRONICO] }
        direccionOCorreo: { type: [string, 'null'] }
        observaciones: { type: [string, 'null'] }
        estado: { type: string, enum: [RECIBIDA, EN_TRAMITE, ENTREGADA, RECHAZADA] }
        solicitadaEn: { type: string, format: date-time }
        atendidaEn: { type: [string, 'null'], format: date-time }
        atendidaPor: { type: [string, 'null'] }
        notaAtencion: { type: [string, 'null'] }

    CerrarSolicitudCopiaHcRequest:
      type: object
      required: [resultado, nota]
      properties:
        resultado: { type: string, enum: [ENTREGADA, RECHAZADA] }
        nota: { type: string, minLength: 10, maxLength: 1000 }

    # ---------- Eventos ----------
    PlazoResumen:
      type: object
      required: [regla, venceEn]
      properties:
        regla:
          type: string
          example: INVESTIGACION_AT
          description: Código de `sst.reglas_termino`.
        baseLegal:
          type: string
          example: Res. 1401/2007
        venceEn: { type: string, format: date-time }

    EventoPlazo:
      type: object
      description: '`plazo.proximo-a-vencer` y `plazo.vencido` (SPEC 09).'
      required: [eventoId, tipo, ocurridoEn, casoId, radicado, plazo]
      properties:
        eventoId: { type: string, format: uuid, description: 'El id del mensaje del outbox: estable entre reintentos.' }
        tipo: { type: string, enum: [plazo.proximo-a-vencer, plazo.vencido] }
        ocurridoEn: { type: string, format: date-time }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        plazo: { $ref: '#/components/schemas/PlazoResumen' }

    EventoCasoValidado:
      type: object
      description: '`caso.validado` (SPEC 05).'
      required: [eventoId, tipo, ocurridoEn, casoId, radicado, numeroReporteOrigen]
      properties:
        eventoId: { type: string, format: uuid, description: 'El id del mensaje del outbox: estable entre reintentos.' }
        tipo: { type: string, enum: [caso.validado] }
        ocurridoEn: { type: string, format: date-time }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        numeroReporteOrigen: { type: string }

    EventoCasoRechazado:
      type: object
      description: '`caso.rechazado` (SPEC 05).'
      required: [eventoId, tipo, ocurridoEn, casoId, radicado, numeroReporteOrigen, motivo]
      properties:
        eventoId: { type: string, format: uuid, description: 'El id del mensaje del outbox: estable entre reintentos.' }
        tipo: { type: string, enum: [caso.rechazado] }
        ocurridoEn: { type: string, format: date-time }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        numeroReporteOrigen: { type: string }
        motivo: { type: string, enum: [DUPLICADO, NO_AFILIADO] }
        duplicadoDe:
          type: [string, 'null']
          format: uuid
          description: El caso del que este sería duplicado, para que la ARL revise un posible falso duplicado.

    EventoIncapacidadRegistrada:
      type: object
      description: '`incapacidad.registrada` (SPEC 07). Solo datos administrativos.'
      required: [eventoId, tipo, ocurridoEn, casoId, radicado, incapacidadId, tipoIncapacidad, fechaInicio, fechaFin, diasAcumulados, alertas]
      properties:
        eventoId: { type: string, format: uuid, description: 'El id del mensaje del outbox: estable entre reintentos.' }
        tipo: { type: string, enum: [incapacidad.registrada] }
        ocurridoEn: { type: string, format: date-time }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        incapacidadId: { type: string, format: uuid }
        tipoIncapacidad:
          type: string
          enum: [INICIAL, PRORROGA]
          description: El tipo de la incapacidad. Se llama así porque `tipo` es el del evento.
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        diasAcumulados: { type: integer, description: 'Los días de la cadena hasta esta incapacidad, incluida.' }
        alertas:
          type: array
          items: { type: string, enum: [ACUMULADO_150_DIAS, ACUMULADO_180_DIAS, ACUMULADO_540_DIAS, CARGA_EXTEMPORANEA] }

    EventoConceptoRegistrado:
      type: object
      description: '`concepto.registrado` (SPEC 06): solo ids y el tipo, nunca el contenido.'
      required: [eventoId, tipo, ocurridoEn, casoId, radicado, registroId, tipoRegistro]
      properties:
        eventoId: { type: string, format: uuid, description: 'El id del mensaje del outbox: estable entre reintentos.' }
        tipo: { type: string, enum: [concepto.registrado] }
        ocurridoEn: { type: string, format: date-time }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        registroId: { type: string, format: uuid }
        tipoRegistro:
          type: string
          enum: [CONCEPTO_MEDICO, EVOLUCION, CONCEPTO_REHABILITACION]
          description: El tipo del registro. Se llama así porque `tipo` es el del evento.
        ipsEmisora:
          type: [string, 'null']
          pattern: '^[0-9]{12}$'
          description: El REPS de la IPS que lo registró, si fue una IPS.

    EventoDictamenNotificado:
      type: object
      description: '`dictamen.notificado` (SPEC 08), sin fundamentos.'
      required: [eventoId, tipo, ocurridoEn, casoId, radicado, dictamenId, porcentajePcl, origen, notificadoEn]
      properties:
        eventoId: { type: string, format: uuid, description: 'El id del mensaje del outbox: estable entre reintentos.' }
        tipo: { type: string, enum: [dictamen.notificado] }
        ocurridoEn: { type: string, format: date-time }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        dictamenId: { type: string, format: uuid }
        porcentajePcl: { type: number, minimum: 0, maximum: 100 }
        origen: { type: string, enum: [LABORAL, COMUN, MIXTO] }
        notificadoEn: { type: string, format: date-time }

    EventoAccesoEmergencia:
      type: object
      description: '`auditoria.acceso-emergencia` (SPEC 08): uno por revisión abierta. Solo ids y el motivo.'
      required: [eventoId, tipo, ocurridoEn, casoId, radicado, revisionId, actorId, motivo, venceRevisionEn]
      properties:
        eventoId: { type: string, format: uuid, description: 'El id del mensaje del outbox: estable entre reintentos.' }
        tipo: { type: string, enum: [auditoria.acceso-emergencia] }
        ocurridoEn: { type: string, format: date-time }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        revisionId: { type: string, format: uuid }
        actorId: { type: string, description: El `sub` de quien accedió. }
        motivo: { type: string, minLength: 20, maxLength: 500 }
        venceRevisionEn: { type: string, format: date-time }

    EventoCasoRemitido:
      type: object
      description: '`caso.remitido` (SPEC 02). Lleva la identificación del trabajador, dato personal y no clínico, que la IPS necesita para atender.'
      required: [eventoId, tipo, ocurridoEn, casoId, radicado, remisionId, tipoEvento, fechaEvento, trabajador]
      properties:
        eventoId: { type: string, format: uuid, description: 'El id del mensaje del outbox: estable entre reintentos.' }
        tipo: { type: string, enum: [caso.remitido] }
        ocurridoEn: { type: string, format: date-time }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        remisionId: { type: string, format: uuid }
        tipoEvento: { type: string, enum: [AccidenteTrabajo, EnfermedadLaboral] }
        fechaEvento: { type: string, format: date-time }
        trabajador: { $ref: '#/components/schemas/Identificacion' }

    EventoRemisionRevocada:
      type: object
      description: '`remision.revocada` (SPEC 02).'
      required: [eventoId, tipo, ocurridoEn, casoId, radicado, remisionId]
      properties:
        eventoId: { type: string, format: uuid, description: 'El id del mensaje del outbox: estable entre reintentos.' }
        tipo: { type: string, enum: [remision.revocada] }
        ocurridoEn: { type: string, format: date-time }
        casoId: { type: string, format: uuid }
        radicado: { type: string }
        remisionId: { type: string, format: uuid }

    # ---------- Errores ----------
    Problema:
      type: object
      description: RFC 9457. `code` es estable y `detail` es legible por humanos.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, example: FURAT_FECHA_FUTURA }
        traceId: { type: string }
        errors:
          type: object
          description: Errores de validación por ruta JSON.
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    Validacion:
      description: Payload inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: https://errors.halsa.co/validacion
            title: Validation failed
            status: 400
            code: VALIDACION
            errors:
              evento.fechaHora: [La fecha del evento no puede ser futura.]
              trabajador.identificacion.numero: [Formato inválido.]
    NoAutenticado:
      description: El token falta, es inválido o expiró.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    StepUpRequerido:
      description: |
        El token es válido pero insuficiente para un acceso sensible (RFC 9470). El frontend debe
        reautenticar con los parámetros del header `WWW-Authenticate`.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: 'Bearer error="insufficient_user_authentication", acr_values="2", max_age="900"'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Prohibido:
      description: Autenticado, pero sin permiso sobre el recurso. Queda auditado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: |
        El recurso no existe o no es visible para el actor. No se distingue entre ambos casos
        para no revelar qué casos existen en otro tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ConflictoIdempotencia:
      description: La `Idempotency-Key` ya se usó con un cuerpo distinto.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ConflictoRegistroClinico:
      description: |
        La `Idempotency-Key` ya se usó con un cuerpo distinto (`Integracion.IdempotenciaConflicto`, solo en la
        integración), o el caso está rechazado o cerrado y no admite registros (`Clinico.CasoNoAdmiteRegistros`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ConflictoDictamen:
      description: |
        El caso ya tiene un dictamen vigente y no se indicó `corrigeA` (`Dictamen.YaExiste`), el vigente ya se notificó
        (`Dictamen.YaNotificado`), o `corrigeA` no es el vigente (`Dictamen.CorrigeANoVigente`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    DemasiadoGrande:
      description: El cuerpo supera el límite (2 MB en integraciones; 10 MB el soporte PDF y 12 MB su request).
    LimiteExcedido:
      description: Se superó el rate limit del cliente.
      headers:
        Retry-After:
          schema: { type: integer }

